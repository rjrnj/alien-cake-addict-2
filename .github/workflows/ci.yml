name: CI

on:
  push:
    branches: [main]
  pull_request:

# the jobs only read the repository
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  check:
    name: Clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # system libraries Bevy needs on Linux (audio, input, X11 and Wayland windowing)
      - name: Install Bevy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # keep the long Bevy build even when clippy or a test fails
          cache-on-failure: true
      # GITHUB_ACTIONS=true here, so each round uses the fixed seed in src/game.rs
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
